
name: Deploy Luxus Production

on:
  push:
    branches:
      - prod
    paths:
      - "frontend/**"
      - "backend/**"
      - "requirements.txt"
      - "backend/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: luxus-production
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'requirements.txt'
              - 'backend/Dockerfile'
              - '.dockerignore'

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_REOWN_PROJECT_ID: ${{ vars.VITE_REOWN_PROJECT_ID }}
          VITE_MULTISENDER_ADDRESS: ${{ vars.VITE_MULTISENDER_ADDRESS }}
          VITE_USDT_ADDRESS: ${{ vars.VITE_USDT_ADDRESS }}
          VITE_USDT_DECIMALS: ${{ vars.VITE_USDT_DECIMALS || '18' }}
        run: npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Upload to S3
        run: aws s3 sync frontend/dist/ s3://luxus-frontend-prod-2026/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1IIDH0Y4TYIFT \
            --paths "/*"

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            552648357125.dkr.ecr.ap-south-1.amazonaws.com/luxus-prod-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
